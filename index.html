}

/* soft rainbow wash over the hair — subtle, keeps the salon's color story */

  content:"";position:absolute;inset:0;
  background:linear-gradient(178deg,

/* rainbow frame accent */
.master-visual::before{
  content:"";position:absolute;inset:-10px;border-radius:34px;z-index:-1;
  background:linear-gradient(140deg,#D14A6E,#8E4FB0,#4E6FC0,#3FA3AE,#5FB877,#C9B45E);
  opacity:.28;filter:blur(18px);
}
.master-title-badge{
  position:absolute;bottom:22px;
  background:var(--paper);padding:14px 22px;border-radius:16px;
  box-shadow:var(--shadow-sm);text-align:center;
}
body.lang-fa .master-title-badge{right:-16px}
body.lang-en .master-title-badge,body.lang-tr .master-title-badge{left:-16px}
.master-title-badge .mt{font-size:16px;font-weight:700;color:var(--ink);line-height:1.3}
.master-title-badge .ms{font-size:12px;color:var(--gold);margin-top:3px;font-weight:500}

.master-name{font-size:clamp(26px,3.4vw,38px);font-weight:700;color:var(--ink);margin-bottom:8px;line-height:1.25}
.master-role{font-size:16px;color:var(--sage-deep);margin-bottom:6px;font-weight:500}
.master-lede{font-size:15.5px;color:#4a4738;line-height:1.95;margin:20px 0 28px;font-weight:300}

.cred-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:26px}
.cred{
  display:flex;gap:13px;align-items:flex-start;
  background:var(--paper);border:1px solid var(--line);
  border-radius:14px;padding:16px 18px;transition:all .35s;
}
.cred:hover{transform:translateY(-3px);box-shadow:var(--shadow-sm);border-color:transparent}
.cred-ico{
  width:38px;height:38px;border-radius:11px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.cred-ico svg{width:19px;height:19px}
.cred-1 .cred-ico{background:linear-gradient(135deg,#D14A6E,#C6407E)}
.cred-2 .cred-ico{background:linear-gradient(135deg,#8E4FB0,#6E5DBE)}
.cred-3 .cred-ico{background:linear-gradient(135deg,#4E6FC0,#3E8ABF)}
.cred-4 .cred-ico{background:linear-gradient(135deg,#3FA3AE,#46B394)}
.cred-5 .cred-ico{background:linear-gradient(135deg,#5FB877,#86BC5E)}
.cred-6 .cred-ico{background:linear-gradient(135deg,#C9B45E,#CE9A5E)}
.cred-txt h5{font-size:14.5px;font-weight:600;color:var(--ink);margin-bottom:3px}
.cred-txt p{font-size:12.5px;color:var(--muted);line-height:1.7;font-weight:300}

.countries{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
.country-chip{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;padding:6px 14px 6px 8px;border-radius:30px;
  background:rgba(126,139,87,.12);color:var(--sage-deep);font-weight:500;
  transition:all .3s;
}
body.lang-en .country-chip,body.lang-tr .country-chip{padding:6px 8px 6px 14px}
.country-chip:hover{background:rgba(126,139,87,.2);transform:translateY(-2px)}
.country-chip .flag{
  width:22px;height:15px;border-radius:3px;flex-shrink:0;
  box-shadow:0 1px 3px rgba(22,21,15,.25);
  overflow:hidden;display:block;
}
.country-chip .flag svg{width:100%;height:100%;display:block}
.country-chip.chip-more{background:transparent;border:1px dashed rgba(126,139,87,.45);color:var(--muted);padding:6px 14px;font-style:normal}
#courses{background:
  radial-gradient(ellipse 60% 50% at 85% 15%, rgba(209,74,110,.10), transparent 60%),
  radial-gradient(ellipse 55% 45% at 10% 70%, rgba(142,79,176,.10), transparent 60%),
  var(--paper)}

/* direct entry to the online academy */
.academy-entry{
  display:inline-flex;align-items:center;gap:13px;margin-top:24px;
  padding:12px 16px 12px 13px;border-radius:18px;
  background:linear-gradient(135deg,#211A24,#432E40);color:var(--cream);
  border:1px solid rgba(226,203,152,.72);
  box-shadow:
    0 0 0 1px rgba(188,105,180,.3),
    0 0 18px rgba(188,105,180,.42),
    0 16px 38px -18px rgba(33,26,36,.92);
  position:relative;isolation:isolate;overflow:hidden;text-align:start;
  animation:academyFloat 3.2s ease-in-out infinite;
  transition:transform .3s,box-shadow .3s,background .3s,border-color .3s;
}
.academy-entry::before{content:"";position:absolute;z-index:-1;inset:-45% auto -45% -28%;width:25%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.32),transparent);transform:skewX(-18deg);animation:academyShine 3.8s ease-in-out infinite}
body.lang-en .academy-entry,body.lang-tr .academy-entry{padding:12px 13px 12px 16px}
.academy-entry:hover{
  transform:translateY(-3px);
  background:linear-gradient(135deg,#2B202D,#593B52);
  border-color:rgba(226,203,152,.92);
  box-shadow:
    0 0 0 1px rgba(210,126,201,.5),
    0 0 26px rgba(210,126,201,.62),
    0 0 11px rgba(226,203,152,.34),
    0 22px 46px -20px rgba(33,26,36,.95);
}
.academy-entry-icon{
  width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;background:rgba(194,163,94,.2);color:#E2CB98;
  border:1px solid rgba(226,203,152,.24);
}
.academy-entry-icon{animation:academyIcon 2.2s ease-in-out infinite}
.academy-entry-icon svg{width:23px;height:23px}
.academy-entry-copy{display:flex;flex-direction:column;line-height:1.45}
.academy-entry-copy strong{font-size:14.5px;font-weight:700;color:var(--cream)}
.academy-entry-copy small{font-size:11.5px;color:rgba(247,243,234,.72);font-weight:300;margin-top:2px}
.academy-entry-arrow{width:19px;height:19px;color:var(--gold-soft);flex-shrink:0;transition:transform .3s}
.academy-entry:hover .academy-entry-arrow{transform:translateX(-3px)}
body.lang-fa .academy-entry-arrow{transform:scaleX(-1)}
body.lang-fa .academy-entry:hover .academy-entry-arrow{transform:translateX(-3px) scaleX(-1)}
body.lang-en .academy-entry:hover .academy-entry-arrow,
body.lang-tr .academy-entry:hover .academy-entry-arrow{transform:translateX(3px)}
@keyframes academyFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes academyIcon{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(226,203,152,.12)}50%{transform:scale(1.08);box-shadow:0 0 0 8px rgba(226,203,152,0)}}
@keyframes academyShine{0%,55%{left:-30%;opacity:0}68%{opacity:1}86%,100%{left:120%;opacity:0}}
.academy-entry:hover{animation:none}

/* opening course announcement */
.welcome-banner{position:fixed;inset:0;z-index:1300;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(15,14,11,.7);backdrop-filter:blur(9px);opacity:0;visibility:hidden;transition:opacity .35s,visibility .35s}
.welcome-banner.open{opacity:1;visibility:visible}
.welcome-card{position:relative;width:min(620px,100%);padding:38px 34px 32px;border:1px solid rgba(226,203,152,.7);border-radius:28px;overflow:hidden;background:radial-gradient(circle at 12% 8%,rgba(209,74,110,.22),transparent 35%),radial-gradient(circle at 90% 100%,rgba(194,163,94,.22),transparent 36%),linear-gradient(145deg,#171512,#292118);color:var(--cream);text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.52);transform:translateY(24px) scale(.96);transition:transform .45s cubic-bezier(.2,.85,.3,1)}
.welcome-banner.open .welcome-card{transform:translateY(0) scale(1)}
.welcome-card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.08) 50%,transparent 65%);animation:welcomeGlow 5s linear infinite}
.welcome-close{position:absolute;top:14px;left:14px;width:38px;height:38px;border:1px solid rgba(247,243,234,.18);border-radius:50%;background:rgba(255,255,255,.07);color:var(--cream);font-size:24px;line-height:1;cursor:pointer;transition:.25s}
.welcome-close:hover{background:rgba(255,255,255,.14);transform:rotate(7deg)}
.welcome-kicker{display:inline-flex;margin-bottom:13px;padding:6px 13px;border-radius:30px;background:rgba(194,163,94,.13);color:var(--gold-soft);font-size:12px;font-weight:600}
.welcome-card h2{font-family:var(--font-fa);font-size:clamp(27px,5vw,40px);line-height:1.35;margin-bottom:12px}
.welcome-card h2 em{font-style:normal;color:#E2CB98}
.welcome-card p{max-width:470px;margin:0 auto 23px;color:rgba(247,243,234,.78);font-size:15px;line-height:1.9}
.welcome-action{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:11px 24px;border-radius:30px;background:linear-gradient(135deg,#C2A35E,#E2CB98);color:#171512;font-weight:800;box-shadow:0 12px 28px rgba(194,163,94,.24);transition:transform .3s,box-shadow .3s}
.welcome-action:hover{transform:translateY(-3px);box-shadow:0 17px 34px rgba(194,163,94,.38)}
@keyframes welcomeGlow{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media(max-width:560px){.welcome-card{padding:35px 20px 25px;border-radius:23px}.welcome-card p{font-size:14px}.welcome-action{width:100%}}
@media(prefers-reduced-motion:reduce){.academy-entry,.academy-entry-icon,.academy-entry::before,.welcome-card::before{animation:none}.pillar,.pillar-ico,.welcome-card{transition:none}}
@media(max-width:560px){
  .academy-entry{width:100%;max-width:390px;justify-content:flex-start;padding:12px 14px}
  .academy-entry-copy{flex:1}
}

/* ================= BEAUTY NEWS — isolated feature ================= */
.beauty-news-home{
  background:#171812;color:var(--cream);overflow:hidden;
  border-block:1px solid rgba(194,163,94,.2);
}
.beauty-news-home::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 20%,rgba(126,139,87,.28),transparent 33%),radial-gradient(circle at 88% 85%,rgba(194,163,94,.16),transparent 30%);
}
.bn-head{display:flex;align-items:end;justify-content:space-between;gap:30px;margin-bottom:36px}
.bn-head .sec-eyebrow{color:var(--gold-soft)}
.bn-head h2{font-family:var(--font-fa);font-size:clamp(34px,5vw,58px);font-weight:700;line-height:1.2;margin-top:10px}
.bn-head h2 em{font-family:var(--font-serif);font-weight:500;color:var(--gold);font-size:1.12em}
.bn-head p{max-width:560px;color:rgba(247,243,234,.66);font-size:15px;margin-top:13px}
.bn-all{
  flex-shrink:0;display:inline-flex;align-items:center;gap:9px;padding:11px 18px;
  border:1px solid rgba(194,163,94,.45);border-radius:40px;color:var(--gold-soft);
  font-size:13px;font-weight:600;transition:.3s;
}
.bn-all:hover{background:var(--gold);color:var(--ink);transform:translateY(-2px)}
.bn-all svg{width:17px;height:17px;transform:scaleX(-1)}
.bn-grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:18px}
.bn-card{position:relative;min-height:350px;border-radius:22px;overflow:hidden;background:#292a21;box-shadow:0 22px 48px -28px #000;isolation:isolate}
.bn-card:first-child{min-height:420px}
.bn-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.bn-card:hover img{transform:scale(1.055)}
.bn-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,6,.04) 18%,rgba(8,8,6,.9) 100%);z-index:1}
.bn-card-copy{position:absolute;z-index:2;inset:auto 0 0;padding:25px}
.bn-tag{display:inline-flex;padding:5px 10px;border-radius:30px;background:var(--gold);color:#171812;font-size:11px;font-weight:700;margin-bottom:12px}
.bn-card h3{font-size:clamp(18px,2vw,25px);line-height:1.55;font-weight:700;margin-bottom:8px}
.bn-card p{font-size:13px;line-height:1.8;color:rgba(247,243,234,.72);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bn-meta{display:flex;gap:12px;align-items:center;color:rgba(247,243,234,.54);font-size:11.5px;margin-top:12px}
.bn-live{display:inline-flex;align-items:center;gap:6px;color:#cbd69f}
.bn-live::before{content:"";width:6px;height:6px;border-radius:50%;background:#aeca63;box-shadow:0 0 0 4px rgba(174,202,99,.12)}
@media(max-width:900px){.bn-grid{grid-template-columns:1fr 1fr}.bn-card:first-child{grid-column:1/-1;min-height:400px}}
@media(max-width:620px){.bn-head{align-items:flex-start;flex-direction:column}.bn-all{align-self:stretch;justify-content:center}.bn-grid{grid-template-columns:1fr}.bn-card:first-child{grid-column:auto;min-height:390px}.bn-card{min-height:330px}.bn-card-copy{padding:21px}.bn-head h2{font-size:36px}}

/* --- next-course banner --- */
.next-banner{
  position:relative;overflow:hidden;
  border-radius:24px;margin-bottom:56px;
  background:linear-gradient(120deg,var(--ink) 0%,#241f14 55%,var(--sage-deep) 130%);
  color:var(--cream);
  padding:44px 48px;
  display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.next-banner::before{
  content:"";position:absolute;top:-40%;width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle,rgba(194,163,94,.22),transparent 70%);
}
body.lang-fa .next-banner::before{left:-60px}
body.lang-en .next-banner::before,body.lang-tr .next-banner::before{right:-60px}
.next-banner-tag{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(194,163,94,.18);border:1px solid rgba(194,163,94,.4);
  color:var(--gold-soft);font-size:12px;font-weight:600;letter-spacing:1px;
  padding:7px 15px;border-radius:30px;margin-bottom:16px;
}
.next-banner-tag .pulse{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}
.next-banner-info{position:relative;z-index:2;flex:1;min-width:280px}
.next-banner-info h3{font-family:var(--font-fa);font-size:clamp(24px,3vw,34px);font-weight:700;margin-bottom:12px;line-height:1.3;color:var(--cream)}
.next-banner-meta{display:flex;gap:24px;flex-wrap:wrap;margin-top:16px}
.next-banner-meta div{display:flex;align-items:center;gap:8px;font-size:14px;color:rgba(247,243,234,.85)}
.next-banner-meta svg{width:18px;height:18px;color:var(--gold)}
.next-banner-cta{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.next-banner-cta .btn{background:var(--gold);color:var(--ink);justify-content:center;white-space:nowrap}
.next-banner-cta .btn:hover{background:var(--gold-soft);transform:translateY(-2px)}
.next-countdown{font-size:12px;color:rgba(247,243,234,.6);text-align:center}

/* --- education sub-heading --- */
.edu-subhead{display:flex;align-items:center;gap:14px;margin:0 0 30px}
.edu-subhead .en-line{flex:1;height:1px;background:var(--line)}
.edu-subhead h3{font-family:var(--font-fa);font-size:23px;font-weight:700;color:var(--ink);white-space:nowrap}
.edu-subhead .en-ico{width:40px;height:40px;border-radius:12px;background:var(--cream-warm);display:flex;align-items:center;justify-content:center;color:var(--sage-deep);flex-shrink:0}
.edu-subhead .en-ico svg{width:22px;height:22px}

/* --- bulletin (course announcements list) --- */
.bulletin{background:var(--cream);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:64px}
.bulletin-row{
  display:flex;align-items:center;gap:22px;padding:22px 26px;
  border-bottom:1px solid var(--line);transition:background .3s;cursor:pointer;
}
.bulletin-row:last-child{border-bottom:none}
.bulletin-row:hover{background:var(--paper)}
.bull-date{
  flex-shrink:0;width:70px;text-align:center;
  background:var(--ink);color:var(--cream);border-radius:12px;padding:10px 6px;
}
.bull-date .d{font-family:var(--font-fa);font-size:22px;font-weight:700;line-height:1}
.bull-date .m{font-size:11px;margin-top:3px;color:var(--gold-soft)}
.bull-info{flex:1;min-width:0}
.bull-info h4{font-size:18px;font-weight:600;color:var(--ink);margin-bottom:4px}
.bull-info p{font-size:13px;color:var(--muted);font-weight:300}
.bull-status{flex-shrink:0;font-size:12px;font-weight:600;padding:6px 14px;border-radius:30px}
.bull-status.open{background:rgba(126,139,87,.15);color:var(--sage-deep)}
.bull-status.soon{background:rgba(194,163,94,.18);color:#9a7d2e}
.bull-status.full{background:rgba(180,80,47,.12);color:#b5502f}
.bull-cta{flex-shrink:0}
.bull-cta button{padding:10px 20px;border-radius:30px;font-size:13px;font-weight:500;background:var(--sage-deep);color:var(--cream);transition:all .3s;white-space:nowrap}
.bull-cta button:hover{background:var(--ink)}
.bull-cta button:disabled{background:var(--cream-warm);color:var(--muted);cursor:not-allowed}

/* --- video courses shop --- */
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:26px}
.video-badge{position:absolute;top:14px;display:flex;align-items:center;gap:6px;background:rgba(22,21,15,.82);color:var(--cream);font-size:11px;font-weight:500;padding:6px 12px;border-radius:30px;backdrop-filter:blur(6px)}
body.lang-fa .video-badge{left:14px}
body.lang-en .video-badge,body.lang-tr .video-badge{right:14px}
.video-badge svg{width:13px;height:13px;color:var(--gold-soft)}
.course-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:56px;height:56px;border-radius:50%;background:rgba(247,243,234,.9);display:flex;align-items:center;justify-content:center;transition:all .3s;opacity:0}
.course-card:hover .course-play{opacity:1;transform:translate(-50%,-50%) scale(1.05)}
.course-play svg{width:22px;height:22px;color:var(--ink);margin-inline-start:3px}
.course-card{
  background:var(--cream);
  border-radius:20px;overflow:hidden;
  border:1px solid var(--line);
  transition:all .4s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  position:relative;
}
/* rainbow top accent that appears on hover — ties cards to the brand */
.course-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:5;
  background:linear-gradient(90deg,#D14A6E,#C6407E,#8E4FB0,#4E6FC0,#3FA3AE,#5FB877,#C9B45E);
  transform:scaleX(0);transform-origin:center;transition:transform .5s;
}
.course-card:hover::before{transform:scaleX(1)}
.course-card:hover{transform:translateY(-8px);box-shadow:0 24px 60px -22px rgba(142,79,176,.35);border-color:transparent}
.course-img{aspect-ratio:16/10;position:relative;overflow:hidden;background:linear-gradient(150deg,var(--sage),var(--sage-deep))}
.course-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.course-card:hover .course-img img{transform:scale(1.06)}
.course-level{position:absolute;top:14px;background:var(--paper);color:var(--ink);font-size:11px;font-weight:600;padding:6px 13px;border-radius:30px;letter-spacing:.5px}
body.lang-fa .course-level{right:14px}
body.lang-en .course-level,body.lang-tr .course-level{left:14px}
.course-body{padding:26px;display:flex;flex-direction:column;flex:1}
.course-body h3{font-size:21px;font-weight:600;margin-bottom:10px;color:var(--ink)}
.course-body p{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:18px;flex:1;font-weight:300}
.course-meta{display:flex;gap:18px;margin-bottom:20px;padding-top:16px;border-top:1px solid var(--line)}
.course-meta div{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sage-deep)}
.course-meta svg{width:15px;height:15px}
.course-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}
.course-price{font-family:var(--font-display);font-size:17px;color:var(--gold)}
body.lang-fa .course-price{font-family:var(--font-fa);font-weight:700}
.course-cta-label{font-size:13px;color:var(--sage-deep);font-weight:500;display:inline-flex;align-items:center;gap:6px}
.course-cta-label::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sage);display:inline-block}
.btn-sm{padding:11px 22px;border-radius:36px;font-size:13px;font-weight:500;background:var(--sage-deep);color:var(--cream);transition:all .3s;white-space:nowrap}
.btn-sm:hover{background:var(--ink);transform:translateY(-1px)}

/* ================= SERVICES ================= */
#services{background:
  radial-gradient(ellipse 55% 50% at 12% 20%, rgba(63,163,174,.11), transparent 60%),
  radial-gradient(ellipse 50% 45% at 88% 80%, rgba(194,163,94,.11), transparent 60%),
  var(--cream)}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px}
.svc-item{
  display:flex;flex-direction:column;gap:15px;
  padding:20px 22px;border:1px solid var(--line);border-radius:16px;
  background:var(--paper);transition:all .35s;position:relative;overflow:hidden;
}
.svc-top{display:flex;align-items:center;gap:16px}
.svc-thumb-slider{
  position:relative;width:72px;height:72px;border-radius:13px;overflow:hidden;flex-shrink:0;
  background:var(--cream-warm);border:1px solid rgba(95,107,66,.12);isolation:isolate;
}
.svc-thumb-slider img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1.08);transition:opacity .72s ease,transform 1.15s cubic-bezier(.2,.75,.25,1);
  will-change:opacity,transform;
}
.svc-thumb-slider img.is-active{opacity:1;transform:scale(1)}
@media(prefers-reduced-motion:reduce){.svc-thumb-slider img{transition:none;transform:none}}
.svc-actions{display:flex;gap:9px}
.svc-btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 12px;border-radius:11px;font-size:13px;font-weight:500;
  font-family:var(--font-fa);cursor:pointer;transition:all .28s;border:1px solid transparent;
}
.svc-btn svg{width:15px;height:15px;flex-shrink:0}
.svc-btn-book{background:var(--sage-deep);color:var(--cream)}
.svc-btn-book:hover{background:var(--sage);transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(95,107,66,.7)}
.svc-btn-gal{background:transparent;color:var(--sage-deep);border-color:rgba(95,107,66,.32)}
.svc-btn-gal:hover{background:rgba(95,107,66,.09);border-color:var(--sage);transform:translateY(-2px)}
.svc-item::before{
  content:"";position:absolute;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,#D14A6E,#8E4FB0,#4E6FC0,#3FA3AE,#5FB877,#C9B45E);
  transform:scaleY(0);transition:transform .4s;
}
body.lang-fa .svc-item::before{right:0}
body.lang-en .svc-item::before,body.lang-tr .svc-item::before{left:0}
.svc-item:hover::before{transform:scaleY(1)}
.svc-item:hover{transform:translateY(-3px);box-shadow:0 14px 34px -16px rgba(63,163,174,.4);border-color:transparent}
.svc-item.svc-focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(194,163,94,.16),0 18px 40px -20px rgba(95,107,66,.55);animation:svcFocus 1.1s ease}
@keyframes svcFocus{0%{transform:scale(.985)}45%{transform:scale(1.015)}100%{transform:scale(1)}}
.svc-num{font-family:var(--font-display);font-size:15px;color:var(--gold);opacity:.75;width:26px;flex-shrink:0}
body.lang-fa .svc-num{font-family:var(--font-fa)}
.svc-info{flex:1;min-width:0}
.svc-info h4{font-size:18px;font-weight:600;color:var(--ink);margin-bottom:3px}
.svc-info p{font-size:12.5px;color:var(--muted);font-weight:300;line-height:1.6}
.svc-arrow{width:19px;height:19px;color:var(--gold);opacity:0;transition:all .3s;flex-shrink:0}
body.lang-fa .svc-item:hover .svc-arrow{transform:translateX(-4px)}
body.lang-en .svc-item:hover .svc-arrow,body.lang-tr .svc-item:hover .svc-arrow{transform:translateX(4px)}

/* services CTA banner */
.svc-cta-banner{
  margin-top:40px;border-radius:22px;padding:36px 44px;
  display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;
  background:linear-gradient(125deg,var(--sage-deep),var(--sage) 60%,#8fa06a);
  color:var(--cream);box-shadow:0 18px 44px -20px rgba(95,107,66,.6);position:relative;overflow:hidden;
}
.svc-cta-banner::before{
  content:"";position:absolute;top:-50%;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(247,243,234,.16),transparent 70%);
}
body.lang-fa .svc-cta-banner::before{left:-40px}
body.lang-en .svc-cta-banner::before,body.lang-tr .svc-cta-banner::before{right:-40px}
.svc-cta-text{position:relative;z-index:2;flex:1;min-width:250px}
.svc-cta-text h3{font-family:var(--font-fa);font-size:clamp(20px,2.4vw,26px);font-weight:700;margin-bottom:8px;color:var(--cream)}
.svc-cta-text p{font-size:14px;opacity:.9;font-weight:300}
.svc-cta-btn{position:relative;z-index:2;background:var(--gold)!important;color:var(--ink)!important;white-space:nowrap;display:inline-flex;align-items:center;gap:9px}
.svc-cta-btn svg{width:19px;height:19px}
.svc-cta-btn:hover{background:var(--gold-soft)!important;transform:translateY(-2px)}

/* ================= SHOP ================= */
#shop{background:
  radial-gradient(ellipse 60% 50% at 85% 15%, rgba(78,111,192,.10), transparent 60%),
  radial-gradient(ellipse 55% 45% at 12% 75%, rgba(209,74,110,.09), transparent 60%),
  var(--paper)}
.shop-filter{display:flex;gap:10px;justify-content:center;margin-bottom:44px;flex-wrap:wrap}
.filter-btn{padding:9px 20px;border-radius:36px;font-size:13.5px;color:var(--muted);border:1px solid var(--line);transition:all .3s;font-weight:400}
.filter-btn.active,.filter-btn:hover{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.product-card{background:var(--cream);border-radius:18px;overflow:hidden;border:1px solid var(--line);transition:all .4s;display:flex;flex-direction:column;position:relative}
.product-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;z-index:5;
  background:linear-gradient(90deg,#4E6FC0,#3FA3AE,#5FB877,#C9B45E,#D14A6E);
  transform:scaleX(0);transform-origin:center;transition:transform .5s;
}
.product-card:hover::before{transform:scaleX(1)}
.product-card:hover{transform:translateY(-6px);box-shadow:0 20px 50px -20px rgba(78,111,192,.3);border-color:transparent}
.product-img{
  aspect-ratio:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  width:100%;padding:0;border:0;cursor:pointer;isolation:isolate;
  background:#fff;
}
.product-img::before,.product-img::after{display:none}
.product-img img{
  width:100%;height:100%;object-fit:contain;position:relative;z-index:1;
  background:transparent;mix-blend-mode:normal;filter:none;transition:transform .5s;
}
.product-card:hover .product-img img{transform:scale(1.05)}
.product-tag{position:absolute;z-index:3;top:12px;font-size:10px;font-weight:600;padding:5px 11px;border-radius:24px;letter-spacing:.5px;text-transform:uppercase;background:var(--gold);color:var(--ink)}
body.lang-fa .product-tag{right:12px}
body.lang-en .product-tag,body.lang-tr .product-tag{left:12px}
.product-body{padding:20px;display:flex;flex-direction:column;flex:1}
.product-cat{font-size:11px;color:var(--sage-deep);letter-spacing:1px;text-transform:uppercase;margin-bottom:7px;font-weight:500}
.product-body h4{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:6px;line-height:1.4}
.product-body .pdesc{font-size:12.5px;color:var(--muted);margin-bottom:16px;flex:1;font-weight:300}
.product-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.product-price{font-family:var(--font-display);font-size:16px;color:var(--ink)}
.product-price.soon{font-family:var(--font-fa);font-size:13px;font-weight:500;color:var(--sage-deep);background:rgba(95,107,66,.09);padding:4px 11px;border-radius:20px;display:inline-block}
body.lang-fa .product-price{font-family:var(--font-fa);font-weight:700}
.add-btn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--sage-deep);color:var(--cream);transition:all .3s;flex-shrink:0}
.add-btn:hover{background:var(--gold);color:var(--ink);transform:scale(1.08)}
.add-btn svg{width:19px;height:19px}
.add-btn.added{background:var(--gold);color:var(--ink)}
.shop-more{display:flex;justify-content:center;margin-top:34px}
.shop-more .btn{display:inline-flex;align-items:center;gap:9px}
.shop-more svg{width:18px;height:18px}

/* ================= GLOBAL SEARCH ================= */
.search-overlay{
  position:fixed;inset:0;background:rgba(22,21,15,.58);backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:all .3s;z-index:230;
}
.search-overlay.open{opacity:1;visibility:visible}
.search-modal{
  position:fixed;left:50%;top:12vh;transform:translate(-50%,-18px) scale(.98);
  width:min(92vw,720px);max-height:76vh;background:var(--paper);border-radius:24px;
  padding:0;
  box-shadow:0 30px 80px -20px rgba(22,21,15,.6);z-index:231;overflow:hidden;
  opacity:0;visibility:hidden;transition:all .35s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
}
.search-modal.open{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1)}
.search-head{display:flex;align-items:center;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line);background:var(--cream)}
.search-field{position:relative;display:flex;align-items:center;flex:1}
.search-field>svg{position:absolute;width:20px;height:20px;color:var(--sage-deep);pointer-events:none}
body.lang-fa .search-field>svg{right:15px}
body.lang-en .search-field>svg,body.lang-tr .search-field>svg{left:15px}
.search-input{
  width:100%;height:48px;border:1px solid rgba(95,107,66,.26);border-radius:15px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:15px;outline:none;
  transition:all .25s;
}
body.lang-fa .search-input{padding:0 48px 0 16px}
body.lang-en .search-input,body.lang-tr .search-input{padding:0 16px 0 48px}
.search-input:focus{border-color:var(--sage);box-shadow:0 0 0 4px rgba(95,107,66,.09)}
.search-close{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--cream-warm);color:var(--ink);flex-shrink:0;transition:all .25s}
.search-close:hover{background:var(--gold);transform:rotate(90deg)}
.search-close svg{width:18px;height:18px}
.search-meta{padding:14px 22px 8px;color:var(--muted);font-size:12.5px}
.search-results{padding:8px 14px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.search-result{
  display:grid;grid-template-columns:58px minmax(0,1fr) 30px;gap:13px;align-items:center;
  width:100%;padding:10px;border-radius:15px;text-align:inherit;transition:all .25s;color:var(--ink);
}
body.lang-fa .search-result{grid-template-columns:30px minmax(0,1fr) 58px}
.search-result:hover,.search-result:focus-visible{background:var(--cream-warm);outline:none}
.search-result-img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:var(--cream-warm);grid-column:1}
body.lang-fa .search-result-img{grid-column:3}
.search-result-copy{min-width:0;grid-column:2}
.search-result-type{display:block;color:var(--sage-deep);font-size:10.5px;font-weight:600;margin-bottom:4px}
.search-result-title{display:block;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-desc{display:block;color:var(--muted);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-arrow{width:18px;height:18px;color:var(--gold);grid-column:3;grid-row:1}
body.lang-fa .search-result-arrow{grid-column:1;transform:scaleX(-1)}
.search-empty{text-align:center;padding:36px 20px;color:var(--muted);font-size:14px;line-height:1.9}
.search-hint{padding:11px 22px 15px;border-top:1px solid var(--line);background:var(--cream);color:var(--muted);font-size:11.5px}

/* ================= CART DRAWER ================= */
.overlay{position:fixed;inset:0;background:rgba(22,21,15,.5);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:all .4s;z-index:200}
.overlay.open{opacity:1;visibility:visible}


/* ============= LIVE COURSE CARD ============= */
.live-course{
  position:relative;background:var(--paper);border-radius:20px;overflow:hidden;
  border:1px solid rgba(22,21,15,.14);box-shadow:0 14px 36px -26px rgba(22,21,15,.46);margin-bottom:14px;
  transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
}
.live-course:hover{transform:translateY(-2px);box-shadow:0 22px 46px -28px rgba(22,21,15,.58)}
.live-course[open]{box-shadow:0 24px 54px -28px rgba(22,21,15,.52)}
.live-course>summary{list-style:none;cursor:pointer}
.live-course>summary::-webkit-details-marker{display:none}
.live-course>summary:focus-visible{outline:3px solid rgba(194,163,94,.62);outline-offset:-3px}
.live-course--online{border-color:rgba(117,84,111,.42)}
.live-course--in-person{border-color:rgba(95,107,66,.32)}
.lc-ribbon{
  display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:30px;
  font-size:11.5px;font-weight:600;background:rgba(247,243,234,.16);color:#fff;
  border:1px solid rgba(247,243,234,.26);white-space:nowrap;
}
.lc-ribbon .pulse{width:8px;height:8px;border-radius:50%;background:#fff;animation:pls 1.6s infinite}
@keyframes pls{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

.lc-head{
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:20px;
  padding:19px 22px;color:var(--cream);min-height:112px;
  background:linear-gradient(125deg,#53603b,var(--sage) 72%,#9aa874);
}
.live-course--online .lc-head{background:linear-gradient(125deg,#594356,#79576f 62%,#9b7182)}
.lc-date{
  width:82px;min-height:72px;flex-shrink:0;text-align:center;background:rgba(247,243,234,.14);
  border:1px solid rgba(247,243,234,.28);border-radius:15px;padding:11px 10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;backdrop-filter:blur(6px);
}
.lc-d{font-family:var(--font-fa);font-size:25px;font-weight:800;line-height:1.15}
.live-course--online .lc-d{font-size:18px}
.lc-m{font-size:11px;opacity:.9;margin-top:3px}
.lc-sep{height:1px;background:rgba(247,243,234,.3);margin:10px 0}
.lc-title{min-width:0}
.lc-tag{
  display:inline-block;font-size:10.5px;padding:3px 10px;border-radius:20px;
  background:rgba(247,243,234,.16);margin-bottom:5px;letter-spacing:.02em;
}
.lc-title h3{font-family:var(--font-fa);font-size:clamp(17px,2vw,21px);font-weight:800;margin-bottom:3px;color:var(--cream);line-height:1.5}
.lc-title p{font-size:12.5px;opacity:.88;font-weight:300;line-height:1.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lc-summary-side{display:flex;align-items:center;gap:10px}
.lc-toggle{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(247,243,234,.14);border:1px solid rgba(247,243,234,.27);color:#fff;flex-shrink:0;
}
.lc-toggle svg{width:17px;height:17px;transition:transform .3s ease}
.live-course[open] .lc-toggle svg{transform:rotate(180deg)}
.lc-buyers{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 10px;border-radius:30px;
  background:rgba(247,243,234,.14);border:1px solid rgba(247,243,234,.2);font-size:11.5px;font-weight:500;color:#fff;
}
.lc-buyers svg{width:14px;height:14px;flex-shrink:0}
.live-course--online .lc-col h4,.live-course--online .lc-new{color:#79576f}
.live-course--online .lc-btn{background:#79576f}
.live-course--online .lc-btn:hover{background:#594356}

.lc-body{display:grid;grid-template-columns:1fr 1fr;gap:34px;padding:32px 38px}
.lc-col h4{
  display:flex;align-items:center;gap:9px;font-size:16px;font-weight:700;
  color:var(--sage-deep);margin-bottom:16px;
}
.lc-col h4 svg{width:19px;height:19px;flex-shrink:0}
.lc-list{list-style:none;display:flex;flex-direction:column;gap:11px}
.lc-list li{
  position:relative;padding-inline-start:24px;font-size:14.5px;color:var(--ink);line-height:1.7;
}
.lc-list li::before{
  content:"";position:absolute;top:9px;width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),#d9b96a);
}
body.lang-fa .lc-list li::before{right:0}
body.lang-en .lc-list li::before,body.lang-tr .lc-list li::before{left:0}
.lc-check li::before{
  content:"✓";background:none;font-size:14px;color:#4a9c60;font-weight:800;
  width:auto;height:auto;top:2px;
}
.lc-note{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:12px}
.lc-sub{font-size:13px;color:var(--muted);font-weight:300;margin-top:12px;line-height:1.7}
.lc-facts{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.lc-facts>div{
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:11px 16px;border-radius:12px;background:var(--cream);border:1px solid var(--line);
}
.lf-k{font-size:12.5px;color:var(--muted)}
.lf-v{font-size:13.5px;font-weight:600;color:var(--ink)}

.lc-foot{
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding:26px 38px 32px;border-top:1px solid var(--line);background:var(--cream);
}
.lc-price{display:flex;flex-direction:column;gap:3px}
.lc-old{font-size:16px;color:var(--muted);text-decoration:line-through;text-decoration-color:#c0554f;text-decoration-thickness:2px}
.lc-new{font-family:var(--font-fa);font-size:30px;font-weight:800;color:var(--sage-deep);line-height:1.1}
.lc-new small{font-size:15px;font-weight:500}
.lc-off{font-size:12px;color:#b0893c;font-weight:600;margin-top:3px}
.lc-btn{display:inline-flex;align-items:center;gap:10px;white-space:nowrap;font-size:15px;padding:15px 30px}
.lc-btn svg{width:18px;height:18px}

@media(max-width:860px){
  .lc-body{grid-template-columns:1fr;gap:26px;padding:26px 24px}
  .lc-head{padding:17px 18px;gap:15px;min-height:104px}
  .lc-foot{padding:22px 24px 26px;flex-direction:column;align-items:stretch;text-align:center}
  .lc-price{align-items:center}
  .lc-btn{justify-content:center;width:100%}
  .lc-date{width:74px;min-height:68px;padding:9px}
  .lc-d{font-size:23px}
}

@media(max-width:560px){
  .live-course{border-radius:17px;margin-bottom:11px}
  .lc-head{grid-template-columns:auto minmax(0,1fr) auto;padding:13px;gap:11px;min-height:92px}
  .lc-date{width:58px;min-height:60px;border-radius:12px;padding:7px 5px}
  .lc-d{font-size:20px}.live-course--online .lc-d{font-size:14px}.lc-m{font-size:9px}
  .lc-tag{font-size:9px;padding:2px 7px;margin-bottom:4px}
  .lc-title h3{font-size:15px;line-height:1.5;margin-bottom:2px}
  .lc-title p{font-size:11px;line-height:1.5}
  .lc-summary-side{gap:0}
  .lc-ribbon{display:none}
  .lc-toggle{width:30px;height:30px}
  .lc-buyers{font-size:10px;margin-top:6px;padding:4px 8px}
  .lc-ribbon .pulse{width:6px;height:6px}
}


/* ============= PRODUCT DETAIL MODAL ============= */
.pinfo-btn{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  margin:10px 0 12px;padding:9px 12px;border-radius:11px;

  font-family:var(--font-fa);font-size:12.5px;font-weight:500;cursor:pointer;transition:all .28s;
}
.pinfo-btn svg{width:15px;height:15px;flex-shrink:0}
.pinfo-btn:hover{background:rgba(95,107,66,.09);border-color:var(--sage);transform:translateY(-1px)}
.pd-overlay{
  position:fixed;inset:0;background:rgba(22,21,15,.6);

  opacity:0;visibility:hidden;transition:all .35s;z-index:212;
}
.pd-overlay.open{opacity:1;visibility:visible}

.pd-modal.open{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}

.pd-back:hover{background:var(--gold)}
.pd-back svg{width:16px;height:16px}
body.lang-fa .pd-back svg{transform:scaleX(-1)}
.pd-close{

.pd-close:hover{background:var(--gold);transform:rotate(90deg)}

let serviceSlideTimers = [];

function stopServiceSlides(){
  serviceSlideTimers.forEach(id=>{ clearTimeout(id); clearInterval(id); });
  serviceSlideTimers = [];
}

function initServiceSlides(){
  stopServiceSlides();
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  document.querySelectorAll('.svc-thumb-slider').forEach((slider,i)=>{
    const slides = getServiceSlides(slider.dataset.service);
    if(slides.length < 2) return;

    const images = slider.querySelectorAll('img');
    let active = 0;
    let slideIndex = 0;
    let loading = false;

    const advance = ()=>{
      if(document.hidden || loading || !slider.isConnected) return;
      const rect = slider.getBoundingClientRect();
      if(rect.bottom < 0 || rect.top > window.innerHeight) return;

      loading = true;
      slideIndex = (slideIndex + 1) % slides.length;
      const nextIndex = active === 0 ? 1 : 0;
      const preload = new Image();
      preload.onload = ()=>{
        if(!slider.isConnected){ loading=false; return; }
        images[nextIndex].src = slides[slideIndex];
        requestAnimationFrame(()=>{
          images[active].classList.remove('is-active');
          images[nextIndex].classList.add('is-active');
          active = nextIndex;
          loading = false;
        });
      };
      preload.onerror = ()=>{ loading=false; };
      preload.src = slides[slideIndex];
    };

    const start = setTimeout(()=>{
      advance();
      const interval = setInterval(advance,2800);
      serviceSlideTimers.push(interval);
    },2400 + (i%5)*110);
    serviceSlideTimers.push(start);
  });
}

function allLangText(obj){ return Object.values(obj || {}).join(' '); }
function normalizeSearchText(value){
  return String(value || '').toLowerCase().replace(/ي/g,'ی').replace(/ك/g,'ک')
    .replace(/[\u064B-\u065F\u0670]/g,'').replace(/\s+/g,' ').trim();
}
function getSiteSearchEntries(){
  const services = SERVICES.map((s,i)=>({kind:"service",key:String(i),img:SERVICE_THUMBS[s.img] || 'img/service-flower.webp',title:s.title,desc:s.desc}));
  const products = PRODUCTS.map(p=>({kind:"product",key:p.img.split('/').pop().replace('.jpg',''),img:p.img,title:p.name,desc:{fa:`${p.cat.fa} — ${p.desc.fa}`,tr:`${p.cat.tr} — ${p.desc.tr}`,en:`${p.cat.en} — ${p.desc.en}`}}));
  const sections = SEARCH_SECTIONS.filter(entry=>!entry.feature || (window.RAZMEHR_FEATURES && window.RAZMEHR_FEATURES[entry.feature]));
  return [...services,...products,...sections];
}

function selectSiteSearch(kind,key){
  closeSiteSearch();
  const direct = SEARCH_SECTIONS.find(entry=>entry.key===key && entry.url);
  if(direct){ window.location.href=direct.url; return; }
  if(kind==='service'){
    const card = document.getElementById(`service-${key}`);
    if(card) setTimeout(()=>{
      card.scrollIntoView({behavior:'smooth',block:'center'});
      card.classList.add('svc-focus');
      setTimeout(()=>card.classList.remove('svc-focus'),2200);
    },120);
    return;
  }
  if(kind==='product'){ setTimeout(()=>openProduct(key),120); return; }
  const section = document.getElementById(key);
  if(section) setTimeout(()=>section.scrollIntoView({behavior:'smooth',block:'start'}),120);
}

function findProduct(id){ return PRODUCTS.find(p=>p.name.en.replace(/\s/g,'_')===id); }

function addToCart(id){
  cart[id] = (cart[id]||0)+1;
  updateCart();
  showToast(T.addedToast[lang]);
  const btns = document.querySelectorAll(`[onclick='addToCart("${id}")']`);
  btns.forEach(b=>{ b.classList.add('added'); setTimeout(()=>b.classList.remove('added'),600); });
}
function changeQty(id, d){
  cart[id] = (cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  updateCart();
}
function removeItem(id){ delete cart[id]; updateCart(); }

function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotalNum(){ return Object.entries(cart).reduce((sum,[id,q])=>{ const p=findProduct(id); return sum + (p?p.priceN*q:0); },0); }

function fmtPrice(n){
  if(lang==="fa"){ return n.toLocaleString('fa-IR'); }
  return n.toLocaleString('en-US');
}

function updateCart(){
  const count = cartCount();
  const cc = document.getElementById('cartCount');
  cc.textContent = lang==="fa"? count.toLocaleString('fa-IR') : count;
  cc.classList.toggle('show', count>0);

  const items = document.getElementById('cartItems');
  const entries = Object.entries(cart);
  if(entries.length===0){
    items.innerHTML = `<div class="cart-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 01-8 0"/></svg><p>${T.emptyCart[lang]}</p></div>`;
    document.getElementById('checkoutBtn').disabled = true;
  } else {
    items.innerHTML = entries.map(([id,q])=>{
      const p = findProduct(id);
      return `<div class="cart-line">
        <img class="cart-line-img" src="${p.img}" alt="">
        <div class="cart-line-info"><h5>${p.name[lang]}</h5><div class="clp">${p.price[lang]} ${CONFIG.currency[lang]}</div></div>

function checkout(){

// نمایش زیبای شماره: 0912 345 6789 یا از فرمت واتساپ
function fmtPhone(num){
  let n = String(num);
  if(n.startsWith('98')) n = '0' + n.slice(2);
  if(n.length===11) return n.slice(0,4)+' '+n.slice(4,7)+' '+n.slice(7);
  return n;
}

/* ═══════════════════════════════════════════════════════════
   GALLERY — نمونه‌کارهای هر خدمت
   برای هر خدمت ۱۵ جای عکس و برای رنگ و لایت ۳۵ جای عکس رزرو شده است:
   img/<کد>1.jpg تا img/<کد>15.jpg
   عکسی که وجود نداشته باشد، خانه‌اش کاملاً نامرئی می‌شود.
   کدها: arus, rang, keratin, kutahi, mikap, shinion, baft,
         nakhon, pedikur, mozhe, daem, tatoo, eslah
   ═══════════════════════════════════════════════════════════ */
const GAL_SLOTS = 15;
const GAL_SERVICE_SLOTS = { rang: 35 };
let lbList = [], lbIndex = 0;

function openGallery(i){
  const s = SERVICES[i];
  document.getElementById('galTitle').textContent = s.title[lang];
  const grid = document.getElementById('galGrid');
  const empty = document.getElementById('galEmpty');
  empty.classList.remove('show');

  let html = '';
  for(let n=1; n<=(GAL_SERVICE_SLOTS[s.img] || GAL_SLOTS); n++){
    const src = `img/${s.img}${n}.jpg`;
    html += `<div class="gal-cell" data-src="${src}">
      <img src="${src}" alt="${s.title[lang]} ${n}" loading="lazy"
           onerror="this.parentElement.classList.add('empty'); this.remove(); galCheckEmpty();"
           onclick="openLightbox('${src}')">
    </div>`;
  }
  grid.innerHTML = html;

  document.getElementById('galOverlay').classList.add('open');
  document.getElementById('galModal').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(galCheckEmpty, 900);
}

/* اگر هیچ عکسی موجود نبود، پیام «به‌زودی» نشان بده */
function galCheckEmpty(){
  const grid = document.getElementById('galGrid');
  if(!grid) return;
  const alive = grid.querySelectorAll('.gal-cell:not(.empty)').length;
  document.getElementById('galEmpty').classList.toggle('show', alive === 0);
}

function closeGallery(){
  document.getElementById('galOverlay').classList.remove('open');
  document.getElementById('galModal').classList.remove('open');
  if(!document.getElementById('lbOverlay').classList.contains('open')) document.body.style.overflow = '';
}

/* ── نمایش بزرگ عکس (لایت‌باکس) ── */
function openLightbox(src){
  const cells = Array.from(document.querySelectorAll('#galGrid .gal-cell:not(.empty)'));
  lbList = cells.map(c=>c.dataset.src);
  lbIndex = Math.max(0, lbList.indexOf(src));
  document.getElementById('lbImg').src = src;
  document.getElementById('lbOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function lbStep(dir){
  if(!lbList.length) return;
  lbIndex = (lbIndex + dir + lbList.length) % lbList.length;
  document.getElementById('lbImg').src = lbList[lbIndex];
}
function closeLightbox(){
  document.getElementById('lbOverlay').classList.remove('open');
  if(document.getElementById('galModal').classList.contains('open')){
    document.body.style.overflow = 'hidden';
  } else {
    document.body.style.overflow = '';
  }
}

/* فرم تماس → پنجره انتخاب راه ارتباطی با پیام آماده
   بر اساس «موضوع درخواست»، خودکار به شماره درست (آموزش/خدمات) وصل می‌شود */
function submitContactForm(e){
  e.preventDefault();
  const f = e.target;
  const name = (f.name_field || f.querySelector('[name="name"]')).value.trim();
  const phone = f.querySelector('[name="phone"]').value.trim();
  const subjRaw = f.querySelector('[name="subject"]').value;
  const note = f.querySelector('[name="message"]').value.trim();

  // مقدار select به شکل "service|رزرو نوبت خدمات" است
  const parts = subjRaw.split('|');
  const kind = parts.length > 1 ? parts[0] : 'service';
  const subject = parts.length > 1 ? parts[1] : subjRaw;

  const L = {
    fa: {greet:"سلام رازمهر عزیز 🌿", nm:"نام", ph:"شماره تماس", sb:"موضوع", ms:"توضیحات"},
    tr: {greet:"Merhaba Razmehr 🌿", nm:"Ad", ph:"Telefon", sb:"Konu", ms:"Mesaj"},
    en: {greet:"Hello Razmehr 🌿", nm:"Name", ph:"Phone", sb:"Subject", ms:"Message"}
  }[lang];

  let msg = `${L.greet}\n\n${L.nm}: ${name}\n${L.ph}: ${phone}\n${L.sb}: ${subject}`;
  if(note) msg += `\n${L.ms}: ${note}`;

  openContactPicker(kind, msg);
}

/* =========================================================
   SCROLL EFFECTS
   ========================================================= */
// header scroll state + dynamic rainbow tint that shifts as you scroll
const headerEl = document.getElementById('header');
// rainbow hue stops the header glow cycles through as the page scrolls
const headerHues = [340, 315, 280, 225, 190, 160, 90, 45, 25];
window.addEventListener('scroll', ()=>{
  const y = window.scrollY;
  headerEl.classList.toggle('scrolled', y>40);
  // map scroll progress through the page to a moving hue
  const docH = document.documentElement.scrollHeight - window.innerHeight;
  const progress = docH>0 ? Math.min(1, y/docH) : 0;
  const idx = progress * (headerHues.length-1);
  const i = Math.floor(idx);
  const frac = idx - i;
  const h1 = headerHues[i];
  const h2 = headerHues[Math.min(i+1, headerHues.length-1)];
  const hue = h1 + (h2-h1)*frac;
  // very soft tinted glow blended into the header's cream background
  if(y>40){
    headerEl.style.background = `linear-gradient(180deg, hsla(${hue.toFixed(0)},55%,88%,.92), rgba(247,243,234,.92))`;
  } else {
    headerEl.style.background = 'rgba(247,243,234,0)';
  }
});

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:.12});

/* =========================================================
   INIT
   ========================================================= */
document.getElementById('year').textContent = new Date().getFullYear();
renderServices(); renderFilters(); renderProducts(); updateCart(); updateSearchCopy();
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

if(window.RAZMEHR_FEATURES?.entryBanner){
  setTimeout(openWelcomeBanner,900);
}
document.getElementById('welcomeBanner')?.addEventListener('click',e=>{if(e.target===e.currentTarget) closeWelcomeBanner()});

// close mobile menu when an in-page link is tapped (external links stay open)
document.querySelectorAll('.nav-links > a[href^="#"]').forEach(a=>a.addEventListener('click',closeMenu));
// close on Escape
document.addEventListener('keydown', e=>{
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    if(document.getElementById('searchModal').classList.contains('open')) closeSiteSearch();
    else openSiteSearch();
    return;
  }
  if(e.key==='Escape'){
    if(document.getElementById('welcomeBanner')?.classList.contains('open')){ closeWelcomeBanner(); return; }
    if(document.getElementById('searchModal').classList.contains('open')){ closeSiteSearch(); return; }
    if(document.getElementById('lbOverlay').classList.contains('open')){ closeLightbox(); return; }
    if(document.getElementById('pdModal').classList.contains('open')){ closeProduct(); return; }
    if(document.getElementById('galModal').classList.contains('open')){ closeGallery(); return; }
    closeMenu(); closeCart(); closeContactPicker();
  }
  if(document.getElementById('lbOverlay').classList.contains('open')){
    if(e.key==='ArrowRight') lbStep(1);
    if(e.key==='ArrowLeft') lbStep(-1);
  }
});
